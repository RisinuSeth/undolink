<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Contact UndoLink support. Send a message and we'll reply by email.">
  <meta name="robots" content="noindex,follow">
  <title>Contact support — UndoLink</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .support-wrap{width:min(620px,calc(100% - 40px));margin:76px auto 90px}
    .support-back{display:inline-block;color:var(--muted);font-size:12px;text-decoration:none;margin-bottom:34px}
    .support-back:hover{color:var(--orange-dark)}
    .support-wrap h1{font:800 clamp(38px,7vw,58px)/1.02 "Plus Jakarta Sans",sans-serif;letter-spacing:-.07em;margin:0 0 16px}
    .support-intro{max-width:500px;color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 34px}
    .support-form{padding:28px;border:1px solid var(--line);background:#fff}
    .support-field{display:block;margin:0 0 20px}
    .support-field span{display:block;font-size:11px;font-weight:700;margin-bottom:8px}
    .support-field input,.support-field textarea{display:block;width:100%;border:1px solid #cfcfcb;border-radius:0;background:#fff;color:var(--ink);font:13px "DM Sans",sans-serif;padding:13px;outline:0}
    .support-field input{height:48px}
    .support-field textarea{min-height:170px;resize:vertical;line-height:1.6}
    .support-field input:focus,.support-field textarea:focus{border-color:var(--orange)}
    .support-note{font-size:10px;line-height:1.6;color:var(--muted);margin:-2px 0 18px}
    .support-status{min-height:18px;font-size:12px;color:var(--muted);margin:12px 0 0}
    .support-status.error{color:#b33d24}
    .support-status.success{color:#38734a}
    .support-trap{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    .support-footer{display:flex;justify-content:space-between;gap:18px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
    .support-footer a{color:var(--ink);text-decoration:none}
    @media(max-width:600px){.support-wrap{margin:42px auto 60px}.support-form{padding:20px 16px}.support-footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="support-wrap">
    <a class="support-back" href="/">← Back to UndoLink</a>
    <p class="eyebrow">WE'RE HERE TO HELP</p>
    <h1>Contact support.</h1>
    <p class="support-intro">Send us a message about your UndoLink experience. We'll use your email address to reply.</p>
    <form class="support-form" id="support-form">
      <label class="support-field"><span>Name <small>(optional)</small></span><input name="name" type="text" maxlength="100" autocomplete="name" placeholder="Your name"></label>
      <label class="support-field"><span>Email address</span><input name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="support-field"><span>Subject</span><input name="subject" type="text" minlength="3" maxlength="150" placeholder="What can we help with?" required></label>
      <label class="support-field"><span>Message</span><textarea name="message" minlength="10" maxlength="5000" placeholder="Describe the issue or question..." required></textarea></label>
      <label class="support-trap" aria-hidden="true">Leave this field empty<input name="company" type="text" tabindex="-1" autocomplete="off"></label>
      <p class="support-note">Please don't include passwords, private link-management keys, or other sensitive information.</p>
      <button class="create-button" id="support-submit" type="submit"><span>Send message</span><span aria-hidden="true">↗︎</span></button>
      <p class="support-status" id="support-status" role="status" aria-live="polite"></p>
    </form>
    <div class="support-footer"><a href="/">UndoLink</a><span>Simple on the surface. Powerful underneath.</span></div>
  </main>
  <script>
    const form = document.getElementById("support-form");
    const button = document.getElementById("support-submit");
    const status = document.getElementById("support-status");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const data = Object.fromEntries(new FormData(form).entries());
      button.disabled = true;
      button.querySelector("span").textContent = "Sending…";
      status.className = "support-status";
      status.textContent = "";
      try {
        const response = await fetch("/api/support", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || "We couldn't send your message.");
        form.reset();
        status.className = "support-status success";
        status.textContent = "Your message has been sent. We'll reply by email.";
      } catch (error) {
        status.className = "support-status error";
        status.textContent = error.message || "We couldn't send your message. Please try again.";
      } finally {
        button.disabled = false;
        button.querySelector("span").textContent = "Send message";
      }
    });
  </script>
</body>
</html>
